name: CI e Testes

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências Node
        run: npm install

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar sintaxe do backend Node
        run: node --check src/backend/server.js

      - name: Verificar sintaxe dos scripts Python
        run: |
          python -m py_compile src/python/consulta_ticker.py
          python -m py_compile src/python/scanner_tendencia.py

      - name: Instalar navegadores do Playwright
        run: npx playwright install --with-deps

      - name: Executar testes Playwright
        run: npx playwright test

      - name: Upload do relatório de testes
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
